name: Release (Flutter)

# Every push to main builds APK + (unsigned) IPA and publishes a versioned GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let overlapping pushes race on the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.7'
  DART_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # ---------- generate the version / tag ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}   # e.g. 1.0.42
      code: ${{ steps.v.outputs.code }}   # e.g. 42  (monotonic build number)
      tag: ${{ steps.v.outputs.tag }}     # e.g. v1.0.42
    steps:
      - id: v
        run: |
          CODE=${{ github.run_number }}
          NAME="1.0.$CODE"
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "code=$CODE"      >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"      >> "$GITHUB_OUTPUT"
          echo "Version $NAME (build $CODE)"

  # ---------- Android APK + AAB ----------
  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.code }} ${{ env.DART_DEFINES }}
      - name: Build App Bundle
        run: flutter build appbundle --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.code }} ${{ env.DART_DEFINES }}
      - name: Rename artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/nanosh-admin-${{ needs.version.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/nanosh-admin-${{ needs.version.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: admin_app/out/*
          if-no-files-found: error

  # ---------- iOS unsigned IPA (no Apple account yet) ----------
  ios:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.code }} ${{ env.DART_DEFINES }}
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          mkdir -p ../../../out
          zip -r "../../../out/nanosh-admin-${{ needs.version.outputs.name }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: admin_app/out/*
          if-no-files-found: error

  # ---------- publish the release with both binaries ----------
  release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Automated build of نانوش الإدارة `${{ needs.version.outputs.name }}` (build ${{ needs.version.outputs.code }}).

            - `*.apk` — installable Android build.
            - `*.aab` — Play Store bundle.
            - `*-unsigned.ipa` — iOS build **without Apple signing** (won't install on a device until iOS signing is added).
          files: dist/*
