name: Release (Flutter)

# Every push to main: create a versioned release first, then build the APK and
# (unsigned) IPA and upload them onto that release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.7'
  DART_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # ---------- 1. generate the version / tag ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}   # e.g. 1.0.42
      code: ${{ steps.v.outputs.code }}   # e.g. 42
      tag: ${{ steps.v.outputs.tag }}     # e.g. v1.0.42
    steps:
      - id: v
        run: |
          CODE=${{ github.run_number }}
          NAME="1.0.$CODE"
          {
            echo "name=$NAME"
            echo "code=$CODE"
            echo "tag=v$NAME"
          } >> "$GITHUB_OUTPUT"

  # ---------- 2. create the (empty) release first ----------
  create_release:
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create release if missing
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

  # ---------- 3a. Android APK + AAB → upload to release ----------
  android:
    needs: [version, create_release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      NAME: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK + AAB
        run: |
          flutter build apk --release --build-name=$NAME --build-number=$CODE $DART_DEFINES
          flutter build appbundle --release --build-name=$NAME --build-number=$CODE $DART_DEFINES
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/nanosh-admin-$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/nanosh-admin-$NAME.aab"
      - name: Upload to release
        run: gh release upload "$TAG" out/nanosh-admin-$NAME.apk out/nanosh-admin-$NAME.aab --clobber --repo "$GITHUB_REPOSITORY"

  # ---------- 3b. iOS unsigned IPA → upload to release ----------
  ios:
    needs: [version, create_release]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: admin_app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      NAME: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign) + package unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-name=$NAME --build-number=$CODE $DART_DEFINES
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          mkdir -p ../../../out
          zip -r "../../../out/nanosh-admin-$NAME-unsigned.ipa" Payload
      - name: Upload to release
        run: gh release upload "$TAG" out/nanosh-admin-$NAME-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
